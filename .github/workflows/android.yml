name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|<style name="AppTheme.NoActionBarLaunch"|<style name="AppTheme.NoActionBarLaunch"|' "$S"
          sed -i '0,/<style name="AppTheme.NoActionBar"[^>]*>/s||&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$S"
          cat "$S"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Voxelcraft.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Voxelcraft-apk
          path: Voxelcraft.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voxelcraft-latest
          name: Voxelcraft (neueste Version)
          files: Voxelcraft.apk
