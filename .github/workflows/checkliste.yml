name: Build Checkliste APK

on:
  push:
    branches: [checkliste-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkliste
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: checkliste/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Checkliste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Checkliste-apk
          path: checkliste/Checkliste.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: checkliste
          name: Checkliste (neueste Version)
          files: checkliste/Checkliste.apk
