<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>FREEBOUND</title>
<style>
  :root { --accent: #ffc83d; --ink: #f8fafc; --panel: rgba(12, 18, 32, 0.86); --line: rgba(255,255,255,0.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b1020; color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }

  /* Panels und Menüs */
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(12,18,32,0.55), rgba(5,8,16,0.92)); padding: 24px; z-index: 20; }
  .panel h1 { font-size: clamp(44px, 9vw, 96px); letter-spacing: 0.12em; margin: 0 0 4px; color: var(--accent);
    text-shadow: 0 6px 30px rgba(255,200,61,0.25); font-weight: 900; }
  .panel h2 { margin: 0 0 14px; font-size: 22px; letter-spacing: 0.06em; color: var(--accent); }
  .sub { margin: 0 0 28px; opacity: 0.75; letter-spacing: 0.08em; }
  .btns { display: flex; flex-direction: column; gap: 12px; width: min(340px, 86vw); }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px; font-size: 17px; cursor: pointer; transition: background .15s, transform .05s; }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #1b1200; border-color: transparent; font-weight: 700; }
  .info { margin-top: 18px; font-size: 13px; opacity: 0.6; }

  #menu, #screen-settings, #pause { background: rgba(5,8,16,0.82); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: min(560px, 94vw);
    max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
  #menu-list { display: flex; flex-direction: column; gap: 10px; }
  #menu-list .item { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 12px 16px; width: 100%; }
  .it-label { font-size: 17px; font-weight: 600; }
  .it-sub { font-size: 13px; opacity: 0.7; margin-top: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; font-size: 16px; }
  .row input[type=range] { width: 55%; accent-color: var(--accent); }
  .row select { font: inherit; background: #111827; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .card .btn-row { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .chip { background: rgba(8,12,22,0.62); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; font-size: 15px; font-weight: 600; text-shadow: 0 1px 2px #000; }
  #h-money { color: #fff4c2; font-variant-numeric: tabular-nums; }
  .hud-left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #h-obj { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 150px; max-width: 70vw; font-size: 15px; }
  #h-job { position: absolute; left: max(14px, env(safe-area-inset-left)); top: 176px; font-size: 13px; opacity: 0.9; }
  #h-speed { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: 90px; font-size: 15px; font-variant-numeric: tabular-nums; }
  #h-prompt { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); font-size: 17px; font-weight: 700;
    background: rgba(8,12,22,0.7); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--accent); white-space: nowrap; }
  #h-prompt:empty { display: none; }
  #h-obj, #h-job, #h-speed { text-shadow: 0 1px 3px #000; }
  #crosshair { display: none; }
  #btn-pause { pointer-events: auto; position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    padding: 8px 12px; font-size: 16px; background: rgba(8,12,22,0.62); }

  /* Touch */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #joy { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 18px; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); pointer-events: auto; touch-action: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%;
    background: rgba(255,200,61,0.55); border: 2px solid rgba(255,255,255,0.5); pointer-events: none; }
  #touch .tbtn { position: absolute; pointer-events: auto; width: 84px; height: 84px; border-radius: 50%; padding: 0; font-size: 13px; font-weight: 700;
    background: rgba(8,12,22,0.6); border: 2px solid rgba(255,255,255,0.3); }
  #t-jump { right: max(24px, env(safe-area-inset-right)); bottom: 36px; width: 96px; height: 96px; }
  #t-act { right: calc(max(24px, env(safe-area-inset-right)) + 110px); bottom: 62px; }
  #t-throw { right: max(24px, env(safe-area-inset-right)); bottom: 150px; width: 72px; height: 72px; }
  #t-full { left: auto; top: 64px; right: max(14px, env(safe-area-inset-right)); width: 48px; height: 48px; font-size: 18px; }

  /* Toast */
  #toast { position: fixed; top: 16%; left: 50%; transform: translate(-50%, -10px); opacity: 0; pointer-events: none; z-index: 30;
    background: rgba(8,12,22,0.85); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 12px; font-size: 16px; font-weight: 600;
    transition: opacity .25s, transform .25s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b1020; z-index: 50; font-size: 20px; letter-spacing: 0.1em; color: var(--accent); }
  #rotate-hint { display: none; position: fixed; inset: 0; background: #0b1020; z-index: 60; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div class="hud-left">
      <span class="chip" id="h-money">0 €</span>
      <span class="chip" id="h-clock"></span>
      <span class="chip" id="h-weather"></span>
    </div>
  </div>
  <button id="btn-pause" class="ghost" style="pointer-events:auto">☰</button>
  <div id="h-obj"></div>
  <div id="h-job"></div>
  <div id="h-speed"></div>
  <div id="h-prompt"></div>
  <div id="crosshair">+</div>
  <div id="touch" class="hidden">
    <div id="joy"><div id="joy-knob"></div></div>
    <button class="tbtn" id="t-jump">Springen</button>
    <button class="tbtn" id="t-act">Aktion</button>
    <button class="tbtn" id="t-throw">Werfen</button>
    <button class="tbtn" id="t-full">⛶</button>
  </div>
</div>

<div id="screen-title" class="panel hidden">
  <h1>FREEBOUND</h1>
  <p class="sub">Eine Stadt. Alle Freiheit.</p>
  <div class="btns">
    <button class="primary" id="b-start">Neues Spiel</button>
    <button id="b-continue">Fortsetzen</button>
    <button id="b-settings">Einstellungen</button>
  </div>
  <p class="info" id="title-info"></p>
</div>

<div id="screen-settings" class="panel hidden">
  <div class="card">
    <h2>Einstellungen</h2>
    <div class="row"><span>Lautstärke</span><input type="range" id="s-vol" min="0" max="1" step="0.05"></div>
    <div class="row"><span>Kamera-Empfindlichkeit</span><input type="range" id="s-sens" min="0.3" max="2.5" step="0.1"></div>
    <div class="row"><span>Y-Achse invertieren</span><input type="checkbox" id="s-invert"></div>
    <div class="row"><span>Grafik</span>
      <select id="s-quality">
        <option value="niedrig">Niedrig (Smartphone)</option>
        <option value="hoch">Hoch (Schatten, Dichte)</option>
      </select>
    </div>
    <div class="btn-row"><button class="primary" id="s-back">Zurück</button></div>
  </div>
</div>

<div id="menu" class="panel hidden">
  <div class="card">
    <h2 id="menu-title"></h2>
    <div id="menu-list"></div>
    <div class="btn-row"><button id="menu-close">Schließen</button></div>
  </div>
</div>

<div id="pause" class="panel hidden">
  <div class="card" style="width:min(380px,92vw)">
    <h2>Pause</h2>
    <div class="btns" style="width:100%">
      <button class="primary" id="p-resume">Weiter</button>
      <button id="p-save">Speichern</button>
      <button id="p-settings">Einstellungen</button>
      <button id="p-abort">Auftrag abbrechen</button>
      <button id="p-title">Hauptmenü</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="loading">FREEBOUND lädt …</div>
<div id="rotate-hint">Bitte das Gerät ins Querformat drehen.</div>

<script>
/*__THREE__*/
</script>
<script>
/*__GAME__*/
</script>
</body>
</html>
