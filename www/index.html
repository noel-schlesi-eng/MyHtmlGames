<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>Nova Phone</title>
<style>
:root{--sbh:calc(env(safe-area-inset-top,0px) + 48px);--bg:#f2f2f7;--card:#ffffff;--text:#000000;--sec:#8a8a8e;--sep:rgba(60,60,67,.16);--fill:#e9e9ee;--acc:#007aff;--gr:#34c759;--rd:#ff3b30;--glass:rgba(248,248,250,.86)}
.dark,.app.dk{--bg:#000000;--card:#1c1c1e;--text:#ffffff;--sec:#8e8e93;--sep:rgba(84,84,88,.65);--fill:#2c2c2e;--glass:rgba(24,24,26,.88)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",sans-serif;color:var(--text);overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit;background:none;border:0;outline:0;-webkit-appearance:none;appearance:none}
input[type=time],input[type=date]{-webkit-appearance:auto;appearance:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}
.hidden{display:none!important}
#device{position:fixed;inset:0;background:#000;color:#fff}
#screen{position:absolute;inset:0;overflow:hidden;background:#000}
#sbtn{display:none}
@media (min-width:600px) and (min-height:760px){
 html,body{background:#16171b;display:flex;align-items:center;justify-content:center}
 #device{position:relative;width:412px;height:892px;flex:none;border-radius:60px;box-shadow:0 0 0 10px #0c0c0e,0 0 0 12px #3a3b41,0 40px 90px rgba(0,0,0,.55)}
 #screen{border-radius:60px}
 #sbtn{display:block;position:absolute;right:-16px;top:200px;width:5px;height:96px;border-radius:0 4px 4px 0;background:#3a3b41;cursor:pointer}
}
/* Wallpaper */
#wall{position:absolute;inset:0}
.wp0{background:linear-gradient(165deg,#0f2027,#203a43 50%,#2c5364)}
.wp1{background:linear-gradient(165deg,#ff9a8b,#ff6a88 45%,#8e7cd8)}
.wp2{background:linear-gradient(165deg,#0f9b8e,#38ef7d)}
.wp3{background:linear-gradient(165deg,#4facfe,#00c6fb 40%,#2f5fd0)}
.wp4{background:radial-gradient(circle at 30% 18%,#ffb347,#e52e71 55%,#24003b)}
.wp5{background:linear-gradient(180deg,#05060a,#1a1a2e 60%,#0f3460)}
/* Status bar */
#sb{position:absolute;left:0;right:0;top:0;height:var(--sbh);padding:env(safe-area-inset-top,0px) 28px 0 36px;display:flex;align-items:center;justify-content:space-between;z-index:980;pointer-events:none;color:#fff;font-weight:600;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.25);transition:color .3s}
#sb.lt{color:var(--text);text-shadow:none}
#sbri{display:flex;align-items:center;gap:6px}
#sbri svg{display:block}
#island{position:absolute;top:calc(env(safe-area-inset-top,0px) + 11px);left:50%;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#000;z-index:981;pointer-events:none}
.bat{display:inline-block;position:relative;width:26px;height:12px;border:1.3px solid currentColor;border-radius:4px;padding:1.5px}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor}
.bat i{display:block;height:100%;border-radius:2px;background:currentColor}
/* Home */
#home{position:absolute;inset:0}
#pgs{position:absolute;left:0;right:0;top:calc(var(--sbh) + 14px);bottom:150px;overflow:hidden;touch-action:pan-y}
#pgwrap{display:flex;width:200%;height:100%;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#pgwrap.p2{transform:translateX(-50%)}
.page{width:50%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:98px;row-gap:8px;align-content:start;padding:8px 8px 0}
#pgdots{position:absolute;left:0;right:0;bottom:136px;display:flex;justify-content:center;gap:8px;pointer-events:none}
#pgdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
#pgdots i.on{background:#fff}
#dock{position:absolute;left:12px;right:12px;bottom:26px;height:100px;border-radius:34px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center}
.ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;color:#fff;font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ic .sq{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;font-size:31px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3),0 4px 10px rgba(0,0,0,.25)}
.ic .lb{max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic.dk .sq{width:60px;height:60px}
.ic.dk .lb{display:none}
.ic .x{display:none;position:absolute;left:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#7a7a80;color:#fff;place-items:center;font-size:16px;line-height:1;font-style:normal;z-index:3}
#home.jig .ic .x{display:grid}
#home.jig .ic .sq{animation:jg .24s infinite alternate ease-in-out}
#home.jig .ic:nth-child(2n) .sq{animation-delay:.08s}
@keyframes jg{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
/* App windows */
#apps{position:absolute;inset:0;z-index:100;pointer-events:none}
.app{position:absolute;inset:0;background:var(--bg);color:var(--text);transform:translateY(103%);visibility:hidden;pointer-events:none;overflow:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s linear .42s}
.app.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s}
.app .nav{position:absolute;left:0;right:0;top:0;height:calc(var(--sbh) + 44px);padding:var(--sbh) 10px 0;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-bottom:.5px solid var(--sep);z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nl,.nr{display:flex;align-items:center;min-width:0}
.nr{justify-content:flex-end}
.nt{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;text-align:center}
.nb{color:var(--acc);font-size:17px;padding:6px;white-space:nowrap}
.app .body{position:absolute;top:calc(var(--sbh) + 44px);left:0;right:0;bottom:0;overflow-y:auto;padding:14px 16px 120px;-webkit-overflow-scrolling:touch}
.body.full{top:0;padding:var(--sbh) 0 0;overflow-y:auto}
.body.fill{top:0;padding:var(--sbh) 0 0;overflow:hidden}
.body.chatbody{top:calc(var(--sbh) + 44px);padding:0;display:flex;flex-direction:column;overflow:hidden}
.sec-t{font-size:13px;color:var(--sec);text-transform:uppercase;margin:18px 16px 6px;letter-spacing:.2px}
.grp{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:46px;border-bottom:.5px solid var(--sep);font-size:16px;position:relative}
.grp .row:last-child{border-bottom:0}
.row.tap:active{background:var(--fill)}
.row>div{min-width:0}
.row .val{margin-left:auto;color:var(--sec);font-size:16px;white-space:nowrap}
.row .tog{margin-left:auto}
.sub{color:var(--sec);font-size:13px}
.empty{color:var(--sec);text-align:center;padding:40px 20px;font-size:15px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;flex:none}
.av.big{width:84px;height:84px;font-size:32px;margin:0 auto 10px}
.av.big2{width:56px;height:56px;border-radius:13px;font-size:28px}
.ri-i{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:16px;color:#fff;flex:none}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:16px;text-align:center;margin-bottom:12px}
.btn.gy{background:var(--fill);color:var(--acc)}
.btn.rd{background:var(--rd)}
.btn.gr{background:var(--gr)}
.pill{background:var(--acc);color:#fff;padding:7px 15px;border-radius:15px;font-weight:600;font-size:14px;flex:none}
.pill.gy{background:var(--fill);color:var(--acc)}
.xb{color:var(--sec);font-size:16px;padding:6px;flex:none}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid var(--sec);flex:none}
.circ.on{background:var(--gr);border-color:var(--gr)}
.inp2{flex:1;min-width:0;font-size:16px;padding:8px 0;width:100%}
.inp{width:100%;padding:13px 14px;border-radius:14px;background:var(--card);font-size:16px}
.srch,.addr-f{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;margin:0 16px 14px;font-size:15px;flex:none}
.addr-f{margin:10px 14px}
.srch input,.addr-f input{flex:1;width:100%;font-size:16px}
.tog{width:51px;height:31px;border-radius:16px;background:#787880;position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s}
.tog.on{background:var(--gr)}
.tog.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 0 14px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill);outline:none;margin:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rbtns{display:flex;gap:12px;margin:20px 0}
.rb{flex:1;padding:14px;border-radius:40px;font-size:17px;font-weight:600;color:#fff}
.rb.gy{background:var(--fill);color:var(--text)}
.rb.gr{background:var(--gr)}
.rb.rd{background:var(--rd)}
/* Chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:2px}
.bub{max-width:76%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.3;word-wrap:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:6px;margin:2px 0}
.bub.them{align-self:flex-start;background:var(--fill);color:var(--text);border-bottom-left-radius:6px;margin:2px 0}
.bub.typ{display:flex;gap:4px;padding:12px 14px}
.bub.typ i{width:7px;height:7px;border-radius:50%;background:var(--sec);animation:tp 1s infinite}
.bub.typ i:nth-child(2){animation-delay:.15s}
.bub.typ i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}
.comp{display:flex;gap:8px;align-items:center;padding:8px 10px 40px;border-top:.5px solid var(--sep);background:var(--glass)}
.cin{flex:1;padding:9px 14px;border-radius:18px;background:var(--card);border:.5px solid var(--sep);font-size:16px}
.sendb{width:34px;height:34px;border-radius:50%;background:#0a84ff;color:#fff;font-size:18px;font-weight:700;flex:none}
/* Contacts */
.qbtns{display:flex;gap:10px;margin:0 0 18px}
.qbtns button{flex:1;background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--acc)}
.qbtns i{font-style:normal;font-size:20px}
/* Calendar */
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--sec);font-size:12px;margin-bottom:4px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.dcell{height:44px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px}
.dcell span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.dcell.today span{color:var(--rd);font-weight:700}
.dcell.sel span{background:var(--acc);color:#fff}
.dcell i.dot{position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--rd)}
.evhead{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font-weight:600}
/* Clock */
.swd{font-size:64px;font-weight:200;text-align:center;margin:28px 0 10px;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:10px;justify-content:center;margin:8px 0}
.presets button{background:var(--fill);color:var(--text);padding:8px 14px;border-radius:14px;font-size:14px}
.presets button:disabled{opacity:.4}
.wt{font-variant-numeric:tabular-nums}
/* Camera */
.cam{position:absolute;inset:0;background:#000;overflow:hidden}
#scn{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.camtop{position:absolute;left:0;right:0;top:calc(var(--sbh) + 6px);display:flex;justify-content:space-between;padding:0 16px;z-index:2}
.cpill{background:rgba(0,0,0,.4);color:#ffd60a;padding:6px 12px;border-radius:14px;font-size:14px;font-weight:600}
.zoomrow{position:absolute;left:0;right:0;bottom:226px;display:flex;justify-content:center;gap:10px;z-index:2}
.zoomrow button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600}
.zoomrow button.on{color:#ffd60a}
.campanel{position:absolute;left:0;right:0;bottom:0;height:200px;padding:0 0 40px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.modes{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:600;color:rgba(255,255,255,.6)}
.modes button.on{color:#ffd60a}
.shutrow{display:flex;align-items:center;justify-content:space-between;padding:0 34px}
.thumb{width:46px;height:46px;border-radius:9px;border:2px solid #fff;background:#222 center/cover}
.shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shut i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .2s}
.shut:active i{transform:scale(.9)}
.shut.vid i{background:#ff3b30}
.shut.rec i{border-radius:10px;width:32px;height:32px;background:#ff3b30}
.flip{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);font-size:20px}
.cd{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:110px;font-weight:200;z-index:3;text-shadow:0 2px 12px rgba(0,0,0,.4);display:none}
.rectime{position:absolute;top:calc(var(--sbh) + 52px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:5px 12px;border-radius:12px;color:#ff453a;font-weight:600;z-index:3;display:none}
.shotflash{position:absolute;inset:0;background:#fff;animation:shf .28s forwards;z-index:4}
@keyframes shf{from{opacity:.85}to{opacity:0}}
/* Photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pthumb{aspect-ratio:3/4;background-size:cover;background-position:center;background-color:#222;position:relative}
.pthumb.vid::after{content:"▶︎";position:absolute;right:6px;bottom:4px;color:#fff;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.vbar{display:flex;justify-content:space-around;align-items:center;padding:10px 0 40px;font-size:24px;border-top:.5px solid var(--sep);background:var(--glass)}
.vinfo{text-align:center;color:var(--sec);font-size:13px;padding:8px 0}
/* Notes */
.ntx{width:100%;height:100%;padding:16px;font-size:17px;line-height:1.4;resize:none;background:none;outline:none;color:var(--text)}
/* Reminders */
.addrow{display:flex;gap:10px;align-items:center;margin-top:8px}
/* Calculator */
.calc{display:flex;flex-direction:column;height:100%;justify-content:flex-end;padding:0 14px 34px}
.cdisp{text-align:right;font-size:80px;font-weight:300;padding:0 12px 10px;overflow:hidden;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ck{height:76px;border-radius:38px;font-size:32px;color:#fff;display:flex;align-items:center;justify-content:center}
.ck.d{background:#333}
.ck.f{background:#a5a5a5;color:#000}
.ck.o{background:#ff9f0a}
.ck.o.on{background:#fff;color:#ff9f0a}
.ck.w{grid-column:span 2;justify-content:flex-start;padding-left:30px}
/* Weather */
.body.wx{top:0;background:linear-gradient(180deg,#4aa3ff,#1d6fd6);color:#fff;padding:var(--sbh) 0 40px}
.body.wx.night{background:linear-gradient(180deg,#1b2a4a,#0b1224)}
.wxh{text-align:center;padding:14px 0 6px}
.wxc{font-size:22px;font-weight:500}
.wxt{font-size:92px;font-weight:200;line-height:1.05}
.wxd{font-size:18px}
.wxhl{font-size:16px;opacity:.9}
.wxcard{background:rgba(255,255,255,.18);border-radius:16px;padding:6px 14px;margin:14px 16px}
.hrs{display:flex;gap:18px;overflow-x:auto;padding:10px 4px}
.hr{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;min-width:46px}
.hr span{font-size:22px}
.fd{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid rgba(255,255,255,.2);font-size:16px}
.fd:last-child{border-bottom:0}
/* Maps */
.map{width:100%;height:250px;display:block;background:#e9e4d8;flex:none}
.pin{cursor:pointer}
.pin circle{fill:#ff3b30;stroke:#fff;stroke-width:2}
.pin text{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;pointer-events:none}
.pin.sel circle{fill:#0a84ff}
.pulse{fill:rgba(10,132,255,.25);transform-origin:0 0;animation:pl 2s infinite}
.me{fill:#0a84ff;stroke:#fff;stroke-width:2}
@keyframes pl{from{transform:scale(.5);opacity:1}to{transform:scale(1.8);opacity:0}}
.pcard{margin:12px 16px;background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column}
.pcard b{font-size:18px}
.pcard small{color:var(--sec)}
/* Music */
.mp{padding:6px 0 10px;text-align:center}
.cover{width:220px;height:220px;margin:0 auto;border-radius:18px;display:grid;place-items:center;font-size:72px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.mt{margin:16px 0 6px}
.mt b{display:block;font-size:22px}
.mt small{color:var(--sec);font-size:16px}
.mtime{display:flex;justify-content:space-between;color:var(--sec);font-size:12px;margin:4px 0 10px}
.mctl{display:flex;justify-content:space-around;align-items:center;margin:6px 10px 20px}
.mctl button{font-size:26px;padding:6px}
.mctl button.big{font-size:44px}
.mctl button.on{color:#ff375f}
.acc{color:#ff375f}
/* Browser */
.fav-g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10px 14px}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.fav span{width:60px;height:60px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:28px}
.pg{padding:16px;line-height:1.5}
.pg h2{margin-bottom:10px}
/* Settings */
.prof{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:14px;padding:14px;margin-bottom:18px;text-align:left}
.prof small{display:block;color:var(--sec);font-size:13px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.wsw{width:100%;height:110px;border-radius:14px;border:3px solid transparent}
.wsw.sel{border-color:var(--acc)}
/* Snake */
.sn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#snc{width:300px;height:300px;border-radius:12px;touch-action:none}
.sn-pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.sn-pad button{height:52px;border-radius:14px;background:var(--fill);font-size:20px;color:#fff}
.sn-hint{color:var(--sec);font-size:13px}
/* Compass */
.cp-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;padding-bottom:40px}
.cp-deg{font-size:52px;font-weight:200}
.cp-dir{font-size:20px;color:#ff9f0a;font-weight:600}
.cp-dial{width:280px;height:280px;border-radius:50%;border:2px solid #444;position:relative;margin:16px 0;transition:transform .25s linear}
.cp-dial span{position:absolute;font-weight:700;font-size:20px}

function openApp(id){
  const A=APPS[id]; if(!A) return;
  if(A.kind==='action'){A.action();return;}
  if(locked){pendingApp=id;swipeUnlock();return;}
  exitJiggle(); closePanels(); closeSwitch();

  if(!el){
    el=document.createElement('section');
    el.className='app'+(A.dark?' dk':''); el.id='app-'+id;
    $('#apps').appendChild(el);
    el.addEventListener('click',e=>{const t=e.target.closest('[data-a]'); if(t&&el.contains(t)&&A.act) A.act(t.dataset.a,t,e,el);});
    el.addEventListener('input',e=>{if(A.input) A.input(e,el);});
    el.addEventListener('submit',e=>{e.preventDefault(); if(A.submit) A.submit(e,el);});
    el.addEventListener('keydown',e=>{if(A.key) A.key(e,el);});
  }
  const i=stack.indexOf(id); if(i>=0) stack.splice(i,1); stack.push(id);
  $$('.app.open').forEach(x=>{ if(x!==el) closeApp(x.id.slice(4)); });
  if(A.render) A.render(el);
  el.style.zIndex=String(10+stack.length);

  setStatusTone(); buzz(4);

}

/* ---------- Gemeinsame Helfer für Zeichnen ---------- */
function drawScene(c,t,hue=200,portrait=false){
  const g=c.getContext('2d'), w=c.width, h=c.height;
  const bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,`hsl(${hue},45%,28%)`); bg.addColorStop(1,`hsl(${(hue+40)%360},40%,12%)`);
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){
    const x=w/2+Math.cos(t/1800*(i+1)*0.7+i)*w*0.34;
    const y=h*0.45+Math.sin(t/1500*(i+2)*0.6+i*1.7)*h*0.28;
    const r=w*(0.1+0.05*Math.sin(t/900+i));
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`hsla(${(hue+i*38)%360},75%,68%,.85)`); gr.addColorStop(1,'hsla(0,0%,0%,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  if(portrait){const gr=g.createRadialGradient(w/2,h*0.42,w*0.2,w/2,h*0.42,w*0.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=gr;g.fillRect(0,0,w,h);}
}

APPS.camera={id:'camera',name:'Kamera',icon:'📷',grad:G.dark,dark:true,
  st:{mode:'Foto',zoom:1,flash:0,timer:false,rec:false,rs:0,hue:200,raf:0,shooting:false,rt:0},

    const s=this.st, modes=['Zeitraffer','Video','Foto','Porträt'];
    el.innerHTML=`<div class="cam"><canvas id="scn" width="300" height="400" style="transform:scale(${s.zoom})"></canvas>

      <div class="zoomrow">${[0.5,1,2].map(z=>`<button class="${s.zoom===z?'on':''}" data-a="zoom" data-z="${z}">${z===0.5?'.5':z}×</button>`).join('')}</div>
      <div class="campanel"><div class="modes">${modes.map(m=>`<button class="${s.mode===m?'on':''}" data-a="mode" data-m="${m}">${m}</button>`).join('')}</div>
      <div class="shutrow"><button class="thumb" id="thumb" data-a="openph"></button><button class="shut ${s.mode==='Video'?'vid':''} ${s.rec?'rec':''}" data-a="shoot"><i></i></button><button class="flip" data-a="flip">🔄</button></div></div></div>`;
    this.thumb(el);
  },
  thumb(el){ const b=el.querySelector('#thumb'); if(b&&S.photos[0]) b.style.backgroundImage=`url(${S.photos[0].src})`; },
  loop(){
    const c=document.getElementById('scn');
    if(c) drawScene(c,performance.now(),this.st.hue,this.st.mode==='Porträt');
    this.st.raf=requestAnimationFrame(()=>this.loop());
  },
  onOpen(){ cancelAnimationFrame(this.st.raf); this.loop(); },
  onClose(){ cancelAnimationFrame(this.st.raf); },
  capture(el){
    const c=el.querySelector('#scn'); if(!c) return;
    S.photos.unshift({id:uid(),src:c.toDataURL('image/jpeg',0.6),kind:'photo',ts:Date.now()});
    S.photos=S.photos.slice(0,40); save();
    const cam=el.querySelector('.cam');
    const f=document.createElement('div'); f.className='shotflash'; cam.appendChild(f); setTimeout(()=>f.remove(),280);
    beep([1500],0.05,0.05);
    this.thumb(el);
  },
  stopRec(el){
    const s=this.st; clearInterval(s.rt); s.rec=false;
    const c=el.querySelector('#scn');
    if(c) S.photos.unshift({id:uid(),src:c.toDataURL('image/jpeg',0.6),kind:'video',ts:Date.now(),dur:Math.max(1,Math.round((Date.now()-s.rs)/1000))});
    S.photos=S.photos.slice(0,40); save();
    el.querySelector('#rect').style.display='none';
    el.querySelector('.shut').classList.remove('rec');
    this.thumb(el); toast('Video gespeichert');
  },
  shoot(el){
    const s=this.st;
    if(s.mode==='Video'){
      if(!s.rec){
        s.rec=true; s.rs=Date.now();
        const r=el.querySelector('#rect'); r.style.display='block';
        el.querySelector('.shut').classList.add('rec');
        s.rt=setInterval(()=>{const sec=Math.floor((Date.now()-s.rs)/1000);r.textContent='● '+fmtMS(sec);},250);
      } else this.stopRec(el);
      return;
    }
    if(s.timer&&!s.shooting){
      s.shooting=true; let n=3;
      const cd=el.querySelector('#cd'); cd.textContent=n; cd.style.display='block';
      const iv=setInterval(()=>{
        n--;
        if(n<=0){clearInterval(iv);cd.style.display='none';s.shooting=false;this.capture(el);}
        else cd.textContent=n;
      },1000);
      return;
    }
    this.capture(el);
  },
  act(a,t,e,el){
    const s=this.st;
    switch(a){
      case 'shoot': return this.shoot(el);
      case 'openph': return openApp('photos');
      case 'flip': s.hue=(s.hue+70)%360; return;
      case 'flash': s.flash=(s.flash+1)%3; t.textContent=['⚡︎ Aus','⚡ An','⚡ Auto'][s.flash]; return;
      case 'timer': s.timer=!s.timer; t.textContent='⏱ '+(s.timer?'3 s':'Aus'); return;
      case 'zoom': s.zoom=+t.dataset.z; { const c=el.querySelector('#scn'); if(c) c.style.transform=`scale(${s.zoom})`; } $$('.zoomrow button',el).forEach(b=>b.classList.toggle('on',+b.dataset.z===s.zoom)); return;
      case 'mode': if(s.rec) return; s.mode=t.dataset.m; $$('.modes button',el).forEach(b=>b.classList.toggle('on',b.dataset.m===s.mode)); el.querySelector('.shut').classList.toggle('vid',s.mode==='Video'); return;
    }
  }
};

/* ================= APPS (Teil B) ================= */
const CITIES=[['Berlin','Europe/Berlin'],['New York','America/New_York'],['Tokio','Asia/Tokyo'],['Sydney','Australia/Sydney'],['London','Europe/London'],['Dubai','Asia/Dubai']];
const SW={run:false,acc:0,base:0,laps:[]};
const TM={run:false,rem:300000,end:0};
function swMs(){return SW.acc+(SW.run?Date.now()-SW.base:0);}
function fmtSW(ms){const cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000)%60,h=Math.floor(ms/3600000);return (h?h+':':'')+pad2(m)+':'+pad2(s)+','+pad2(cs);}
function tmMs(){return TM.run?Math.max(0,TM.end-Date.now()):TM.rem;}
function fmtTM(ms){const s=Math.ceil(ms/1000);return pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s/60)%60)+':'+pad2(s%60);}

/* --- Uhr --- */

    <div class="rbtns"><button class="rb gy" data-a="tmreset">Zurücksetzen</button><button class="rb ${TM.run?'rd':'gr'}" data-a="tmtog">${TM.run?'Pause':'Start'}</button></div>`;
  },
  tick(el){
    $$('.wt',el).forEach(w=>{w.textContent=fmtTz(w.dataset.tz);});
    const sd=el.querySelector('#swd'); if(sd) sd.textContent=fmtSW(swMs());
    const td=el.querySelector('#tmd'); if(td) td.textContent=fmtTM(tmMs());
  },
  act(a,t,e,el){
    switch(a){
      case 'tab': this.st.tab=t.dataset.t; return this.render(el);
      case 'altog': { const A=S.alarms.find(x=>x.id===t.dataset.id); if(A){A.on=!A.on;save();} break; }
      case 'aldel': S.alarms=S.alarms.filter(x=>x.id!==t.dataset.id); save(); break;
      case 'aladd': { const tm=el.querySelector('#altime').value||'07:00'; const lb=el.querySelector('#allabel').value.trim(); S.alarms.push({id:uid(),time:tm,label:lb,on:true,fired:''}); save(); break; }
      case 'swtog': if(SW.run){SW.acc+=Date.now()-SW.base;SW.run=false;} else {SW.base=Date.now();SW.run=true;} break;
      case 'swlap': if(SW.run){SW.laps.push(swMs());} else {SW.acc=0;SW.laps=[];} break;
      case 'tmset': if(!TM.run) TM.rem=+t.dataset.m*60000; break;
      case 'tmtog': if(TM.run){TM.rem=Math.max(0,TM.end-Date.now());TM.run=false;} else if(TM.rem>0){TM.end=Date.now()+TM.rem;TM.run=true;} break;
      case 'tmreset': TM.run=false; TM.rem=300000; break;
      default: return;
    }
    this.render(el);
  }
};

/* --- Rechner --- */
const CALC_KEYS=[['AC','±','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['0','.','=']];
function fmtCalc(v){ if(v==='Fehler') return v; return String(v).replace('.',',').slice(0,14); }
APPS.calc={id:'calc',name:'Rechner',icon:'🧮',grad:G.orange,dark:true,
  st:{cur:'0',prev:null,op:null,fresh:false},
  render(el){
    const s=this.st, ops=['÷','×','−','+'];
    el.innerHTML=`<div class="nav" style="display:none"></div><div class="body fill"><div class="calc"><div class="cdisp">${fmtCalc(s.cur)}</div><div class="ckeys">${CALC_KEYS.map(r=>r.map(k=>{
      const cls=k==='0'?'w':(ops.includes(k)||k==='=')?'o':(['AC','±','%'].includes(k)?'f':'d');
      const on=(ops.includes(k)&&s.op===k&&s.fresh)?' on':'';
      return `<button class="ck ${cls}${on}" data-a="ck" data-k="${k}">${k}</button>`;
    }).join('')).join('')}</div></div></div>`;
  },
  press(k){
    const c=this.st;
    if(/\d/.test(k)){
      if(c.fresh||(c.cur==='0'&&k!=='.')){c.cur=k;c.fresh=false;}
      else if(c.cur.replace(/[-.]/g,'').length<12) c.cur+=k;
    } else if(k==='.'){
      if(c.fresh){c.cur='0.';c.fresh=false;} else if(!c.cur.includes('.')) c.cur+='.';
    } else if(k==='AC'){
      this.st={cur:'0',prev:null,op:null,fresh:false};
    } else if(k==='±'){
      c.cur=c.cur.startsWith('-')?c.cur.slice(1):(c.cur==='0'?c.cur:'-'+c.cur);
    } else if(k==='%'){
      c.cur=String(parseFloat(c.cur)/100);
    } else if(['+','−','×','÷'].includes(k)){
      if(c.op&&!c.fresh) this.eq();
      c.prev=parseFloat(c.cur); c.op=k; c.fresh=true;
    } else if(k==='='){

/* --- Assistent (regelbasiert) --- */
const JOKES=['Warum können Geister so schlecht lügen? Man sieht durch sie hindurch.','Was sagt ein Keks beim Arzt? Mir bröckelt alles.','Treffen sich zwei Stühle. Sagt der eine: „Sitzt du?“ 😄'];
APPS.assistant={id:'assistant',name:'Assistent',icon:'🎙️',grad:G.purple,dark:true,
  st:{log:[{me:false,t:'Hallo! Frag mich nach Uhrzeit, Datum, Wetter, einem Witz oder einer Rechnung wie 12 * 4.'}]},
  render(el){
    frame(el,nav('','Assistent',''),'<div class="chat"><div class="msgs" id="amsgs"></div><form class="comp"><input id="ain" class="cin" placeholder="Frag etwas …" autocomplete="off"><button type="submit" class="sendb">↑</button></form></div>','chatbody');
    this.bub(el);
  },
  bub(el){
    const b=el.querySelector('#amsgs'); if(!b) return;
    b.innerHTML=this.st.log.map(m=>`<div class="bub ${m.me?'me':'them'}">${esc(m.t)}</div>`).join('');
    b.scrollTop=b.scrollHeight;
  },
  submit(e,el){
    const inp=el.querySelector('#ain'); const q=inp.value.trim(); if(!q) return;
    inp.value='';
    this.st.log.push({me:true,t:q}); this.st.log.push({me:false,t:this.answer(q)});
    this.bub(el);
  },
  answer(q){
    const l=q.toLowerCase(), now=new Date();
    if(/hallo|hey|\bhi\b/.test(l)) return 'Hallo '+S.name.split(' ')[0]+'! Wie kann ich helfen?';
    if(/uhr|zeit|spät/.test(l)) return 'Es ist gerade '+hhmm(now)+' Uhr.';
    if(/datum|heute/.test(l)) return 'Heute ist '+now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
    if(/wetter|regen|sonne/.test(l)) return 'In '+S.city+' sind es laut Beispieldaten etwa 12 °C und bewölkt.';
    if(/witz/.test(l)) return pick(JOKES);
    if(/danke/.test(l)) return 'Gern geschehen!';
    const m=l.match(/(-?\d+(?:[.,]\d+)?)\s*([+\-*x×\/:÷])\s*(-?\d+(?:[.,]\d+)?)/);
    if(m){
      const a=parseFloat(m[1].replace(',','.')), b=parseFloat(m[3].replace(',','.'));
      let r; switch(m[2]){case '+':r=a+b;break;case '-':r=a-b;break;case '*':case 'x':case '×':r=a*b;break;default:r=b?a/b:NaN;}
      return isNaN(r)?'Das geht nicht.':'Das Ergebnis ist '+(+r.toFixed(6))+'.';
    }
    return 'Dazu habe ich in dieser Simulation keine Antwort. Versuch es mit Uhrzeit, Wetter, Witz oder einer Rechnung.';
  }
};

const DIRS=['N','NO','O','SO','S','SW','W','NW'];
const CP={h:0,real:false};
function cpHandler(e){ if(e.alpha!=null){CP.real=true;CP.h=(360-e.alpha+360)%360;} }
APPS.compass={id:'compass',name:'Kompass',icon:'🧭',grad:G.dark,dark:true,
  render(el){
    frame(el,null,`<div class="cp-wrap"><div class="cp-deg" id="cpdeg">0°</div><div class="cp-dir" id="cpdir">N</div><div class="cp-dial" id="cpdial"><span class="n">N</span><span class="e">O</span><span class="s">S</span><span class="w">W</span></div><div class="sub" id="cpnote"></div></div>`,'full');

/* --- Snake --- */
const SN={dir:{x:1,y:0},q:[],snake:[],food:{x:5,y:5},score:0,over:false,iv:0,started:false};
function snReset(){ SN.snake=[{x:4,y:7},{x:3,y:7},{x:2,y:7}]; SN.dir={x:1,y:0}; SN.q=[]; SN.score=0; SN.over=false; SN.started=true; snFood(); }
function snFood(){ let f; do{ f={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)}; }while(SN.snake.some(s=>s.x===f.x&&s.y===f.y)); SN.food=f; }
function snTurn(x,y){ const last=SN.q.length?SN.q[SN.q.length-1]:SN.dir; if(x===-last.x&&y===-last.y) return; if(SN.q.length<3) SN.q.push({x,y}); }
function snStep(){
  if(!SN.started||SN.over) return;
  if(SN.q.length) SN.dir=SN.q.shift();
  const h={x:SN.snake[0].x+SN.dir.x,y:SN.snake[0].y+SN.dir.y};
  if(h.x<0||h.y<0||h.x>=15||h.y>=15||SN.snake.some(s=>s.x===h.x&&s.y===h.y)){
    SN.over=true; if(SN.score>S.high){S.high=SN.score;save();} buzz([0,100,80,100]);
  } else {
    SN.snake.unshift(h);
    if(h.x===SN.food.x&&h.y===SN.food.y){SN.score++;snFood();beep([880],0.05,0.05);}
    else SN.snake.pop();
  }
  snDraw();
}
function snDraw(){
  const c=document.getElementById('snc'); if(!c) return;
  const g=c.getContext('2d');
  g.fillStyle='#111'; g.fillRect(0,0,300,300);
  g.fillStyle='#ff453a'; g.beginPath(); g.arc(SN.food.x*20+10,SN.food.y*20+10,8,0,Math.PI*2); g.fill();
  SN.snake.forEach((s,i)=>{g.fillStyle=i?'#30d158':'#a6f5b8';g.fillRect(s.x*20+1,s.y*20+1,18,18);});
  if(SN.over){
    g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(0,0,300,300);
    g.fillStyle='#fff'; g.textAlign='center'; g.font='bold 22px sans-serif'; g.fillText('Game Over',150,140);
    g.font='16px sans-serif'; g.fillText('Punkte: '+SN.score+'  ·  Rekord: '+S.high,150,170);
  }
  const sc=document.getElementById('snsc'); if(sc) sc.textContent=SN.score;
}
APPS.games={id:'games',name:'Snake',icon:'🐍',grad:G.green,dark:true,
  render(el){
    frame(el,nav('','Snake',NB('new','Neu')),
      `<div class="sn-wrap"><div class="sn-hint">Punkte <b id="snsc">${SN.score}</b> · Rekord <b>${S.high}</b></div>
       <canvas id="snc" width="300" height="300"></canvas>
       <div class="sn-pad"><span></span><button data-a="up">▲</button><span></span><button data-a="left">◀</button><button data-a="down">▼</button><button data-a="right">▶</button></div>
       <div class="sn-hint">Pfeile, Wischen auf dem Feld oder Tastatur</div></div>`,'');
    if(!SN.started) snReset();
    snDraw();
  },
  onOpen(){ if(!SN.started) snReset(); snDraw(); clearInterval(SN.iv); SN.iv=setInterval(snStep,140); },
  onClose(){ clearInterval(SN.iv); },
  act(a,t,e,el){
    if(a==='new'){snReset();snDraw();return;}
    if(a==='up')snTurn(0,-1); if(a==='down')snTurn(0,1); if(a==='left')snTurn(-1,0); if(a==='right')snTurn(1,0);
  },
  key(e){
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    const d=map[e.key]; if(d){e.preventDefault();snTurn(d[0],d[1]);}
  },
  input(){},
  submit(){}
};
let swipeStart=null;
document.addEventListener('pointerdown',e=>{ if(e.target&&e.target.id==='snc') swipeStart={x:e.clientX,y:e.clientY}; });
document.addEventListener('pointerup',e=>{
  if(!swipeStart) return;
  const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y; swipeStart=null;
  if(Math.abs(dx)<12&&Math.abs(dy)<12) return;
  if(Math.abs(dx)>Math.abs(dy)) snTurn(dx>0?1:-1,0); else snTurn(0,dy>0?1:-1);
});

/* --- Taschenlampe (Aktion) --- */
APPS.torch={id:'torch',name:'Taschenlampe',icon:'🔦',grad:G.dark,kind:'action',action(){toggleTorch();}};
/* ================= Verdrahtung & Start ================= */
function bindUI(){
  /* Startbildschirm: Seiten, Icons, Antippen, Halten (Wackelmodus) */
  const PGS=$('#pgs');
  let pd=null, sup=false;
  PGS.addEventListener('pointerdown',e=>{
    sup=false;
    const ic=e.target.closest('.ic');
    pd={x:e.clientX,y:e.clientY,moved:false,t:null};
    if(ic&&!$('#home').classList.contains('jig')){
      pd.t=setTimeout(()=>{ if(pd&&!pd.moved){ sup=true; enterJiggle(); } },480);
    }
  });
  PGS.addEventListener('pointermove',e=>{
    if(pd&&!pd.moved&&(Math.abs(e.clientX-pd.x)>8||Math.abs(e.clientY-pd.y)>8)){ pd.moved=true; clearTimeout(pd.t); }
  });
  const endPg=e=>{
    if(!pd) return;
    clearTimeout(pd.t);
    if(pd.moved){ sup=true; const dx=e.clientX-pd.x; if(Math.abs(dx)>50) setPage(dx<0?2:1); }
    pd=null;
  };
  PGS.addEventListener('pointerup',endPg);
  PGS.addEventListener('pointercancel',endPg);
  PGS.addEventListener('click',e=>{
    if(sup){ sup=false; return; }
    const x=e.target.closest('.x');
    if(x){ uninstall(x.dataset.un); return; }
    const ic=e.target.closest('.ic');
    if($('#home').classList.contains('jig')){ if(!ic) exitJiggle(); return; }
    if(ic) openApp(ic.dataset.app);
  });
  $('#dock').addEventListener('click',e=>{ const ic=e.target.closest('.ic'); if(ic) openApp(ic.dataset.app); });

  /* Gesten: unten wischen = Start / Übersicht */
  const HZ=$('#hz');
  let hy=null, ht=0;
  HZ.addEventListener('pointerdown',e=>{ hy=e.clientY; ht=Date.now(); HZ.setPointerCapture(e.pointerId); });
  HZ.addEventListener('pointerup',e=>{
    if(hy==null) return;
    const dy=hy-e.clientY, dt=Date.now()-ht; hy=null;
    if(dy<50) return;
    if($('#sw').classList.contains('show')) return closeSwitch();
    if(anyOpen()){ if(dt>380) openSwitcher(); else goHome(); }
  });
  HZ.addEventListener('pointercancel',()=>{hy=null;});

  /* Oben wischen: links = Mitteilungen, rechts = Kontrollzentrum */
  [['#tzl','#nc'],['#tzr','#cc']].forEach(([z,p])=>{
    const Z=$(z); let y0=null;
    Z.addEventListener('pointerdown',e=>{ y0=e.clientY; Z.setPointerCapture(e.pointerId); });
    Z.addEventListener('pointerup',e=>{ if(y0!=null&&e.clientY-y0>28) openPanel(p); y0=null; });
    Z.addEventListener('pointercancel',()=>{y0=null;});
  });
  ['#cc','#nc'].forEach(sel=>{
    const P=$(sel); let y0=null;
    P.addEventListener('pointerdown',e=>{ y0=e.target.closest('button,input,.nc-i')?null:e.clientY; });
    P.addEventListener('pointerup',e=>{ if(y0!=null&&y0-e.clientY>60) closePanels(); y0=null; });
  });
  $('#cc').addEventListener('click',e=>{
    const t=e.target.closest('[data-cct],[data-ccq],[data-ccm]'); if(!t) return;
    if(t.dataset.cct){ const k=t.dataset.cct; S[k]=!S[k]; save(); applyAll(); }
    if(t.dataset.ccq){
      const q=t.dataset.ccq;
      closePanels();
      if(q==='torch') toggleTorch();
      else if(q==='timer'){ APPS.clock.st.tab='tm'; openApp('clock'); }
      else if(q==='calc') openApp('calc');
      else if(q==='cam') openApp('camera');
      else if(q==='lock') lockNow();
      else if(q==='off') screenOff(true);
    }
    if(t.dataset.ccm){
      if(t.dataset.ccm==='play') mToggle();
      if(t.dataset.ccm==='next') mNext();
      if(t.dataset.ccm==='prev') mPrev();
      updCC();
    }
  });
  $('#ccb').addEventListener('input',e=>{ S.bright=+e.target.value; save(); applyAll(); });
  $('#ccv').addEventListener('input',e=>{ S.vol=+e.target.value; save(); });
  $('#nc').addEventListener('click',e=>{
    if(e.target.closest('[data-ncclear]')){ S.notifs=[]; save(); renderNC(); renderLock(); return; }
    const n=e.target.closest('[data-nc]'); if(!n) return;
    const item=S.notifs.find(x=>x.id===n.dataset.nc);
    S.notifs=S.notifs.filter(x=>x.id!==n.dataset.nc); save();
    closePanels(); renderLock();
    if(item&&item.app){ if(locked){pendingApp=item.app;swipeUnlock();} else openApp(item.app); }
  });

  /* Mitteilungs-Banner */
  $('#banner').addEventListener('click',()=>{
    const a=$('#banner').dataset.app;
    $('#banner').classList.remove('show');
    if(locked){ pendingApp=a||null; swipeUnlock(); }
    else if(a) openApp(a);
  });

  /* Sperrbildschirm */
  const LK=$('#lock'); let ly=null;
  LK.addEventListener('pointerdown',e=>{
    if(!locked||e.target.closest('#pad,.lk-round')){ ly=null; return; }
    ly=e.clientY;
  });
  LK.addEventListener('pointerup',e=>{
    if(ly==null) return;
    const dy=ly-e.clientY; ly=null;
    if(dy>50) swipeUnlock();
  });
  $('#lkflash').addEventListener('click',toggleTorch);
  $('#lkcam').addEventListener('click',()=>{ pendingApp='camera'; swipeUnlock(); });
  $('#pkgrid').innerHTML=['1','2','3','4','5','6','7','8','9','','0','del'].map(k=>k===''?'<span></span>':`<button class="pk" data-pk="${k}">${k==='del'?'⌫':k}</button>`).join('');
  $('#pad').addEventListener('click',e=>{
    const b=e.target.closest('[data-pk]'); if(!b) return;
    const k=b.dataset.pk;
    if(k==='cancel'){ pinBuf=''; setPin(); $('#pad').style.display='none'; return; }
    if(k==='del') pinBuf=pinBuf.slice(0,-1);
    else if(pinBuf.length<4){ pinBuf+=k; buzz(6); beep(DIAL(k)); }
    setPin();
    if(pinBuf.length===4){
      if(pinBuf===S.passcode){ pinBuf=''; setPin(); unlock(); }
      else {
        buzz([0,60,80,60]);
        const d=$('#dots'); d.classList.add('shake');
        setTimeout(()=>{ d.classList.remove('shake'); pinBuf=''; setPin(); },450);
      }
    }
  });

  /* Anruf-Overlay */
  $('#call').addEventListener('click',e=>{
    const b=e.target.closest('[data-c]'); if(!b||!CALL) return;
    const c=b.dataset.c;
    if(c==='decline') return endCall('miss');
    if(c==='end') return endCall();
    if(c==='accept'){ CALL.state='active'; CALL.start=Date.now(); }
    if(c==='mute') CALL.muted=!CALL.muted;
    if(c==='spk') CALL.spk=!CALL.spk;
    renderCall();
  });

  /* Umschalter */
  $('#sw').addEventListener('click',e=>{
    const x=e.target.closest('[data-swx]');
    if(x){ e.stopPropagation(); killApp(x.dataset.swx); openSwitcher(); return; }
    const c=e.target.closest('[data-sw]');
    if(c){ closeSwitch(); openApp(c.dataset.sw); return; }
    closeSwitch();
  });

  /* Taschenlampe, Bildschirm aus, Seitentaste */
  $('#torch').addEventListener('click',toggleTorch);
  $('#off').addEventListener('click',()=>screenOff(false));
  $('#sbtn').addEventListener('click',()=>{
    if($('#off').classList.contains('show')) screenOff(false);
    else { lockNow(); screenOff(true); }
  });

  /* Android-Zurück-Taste: schließt Panels/Apps statt die App zu beenden */
  window.addEventListener('popstate',()=>{
    if(panelsOpen()) closePanels();
    else if($('#sw').classList.contains('show')) closeSwitch();
    else if(anyOpen()) goHome();
    else if($('#home').classList.contains('jig')) exitJiggle();
    try{history.pushState({n:Date.now()},'');}catch(err){}
  });
  document.addEventListener('contextmenu',e=>e.preventDefault());

}

function init(){
  S=load();
  if(!S.seeded) seed();
  registerInstalled();
  renderHome();
  setPage(1);
  applyAll(); updClock(); renderLock(); renderNC();
  lockNow();
  bindUI();
  try{history.pushState({n:1},'');}catch(e){}
  setInterval(updClock,1000);
  setInterval(()=>{ $$('.app.open').forEach(el=>{ const A=APPS[el.id.slice(4)]; if(A&&A.tick) A.tick(el); }); },250);
  setInterval(callTick,500);
  setInterval(globalTimers,500);
  setInterval(checkAlarms,10000);
  setInterval(batteryTick,60000);
  setInterval(stepsTick,60000);
  setTimeout(()=>$('#boot').classList.add('gone'),1300);
}
init();
</script>
