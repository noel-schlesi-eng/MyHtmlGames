<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0718">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flip 7</title>
<style>
:root{--gold:#ffd166;--pink:#ff4d9d;--cyan:#38e1ff;--violet:#7b5cff;--green:#35e28a;--txt:#f6f2ff;--mut:#a79cc9;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;background:#07050f}
body{background:radial-gradient(120% 75% at 50% -8%,#3d1f86 0%,#1b1044 38%,#0b0718 72%,#060411 100%)}
button,input{font:inherit;color:inherit}
input{-webkit-user-select:text;user-select:text}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.hide{display:none!important}
.lbl{font-weight:700;color:var(--mut);font-size:14px}
.sub{margin:0;color:var(--mut);font-size:14px;line-height:1.4}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- Menü ---------- */
#menu{justify-content:space-between;overflow:hidden}
.bgc{position:absolute;width:74px;height:104px;border-radius:13px;opacity:.14;background:linear-gradient(160deg,#ff4d9d,#7b5cff);transform:rotate(var(--r));animation:drift 9s ease-in-out infinite;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-18px) rotate(calc(var(--r) + 6deg))}}
.logo{text-align:center;margin-top:calc(env(safe-area-inset-top,0px) + 18px);position:relative}
.logo h1{margin:0;font-weight:900;font-size:clamp(70px,25vmin,138px);line-height:.95;letter-spacing:.03em;background:linear-gradient(180deg,#fffbe8 0%,#ffd166 42%,#ff4d9d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 26px rgba(255,77,157,.45));animation:bob 4s ease-in-out infinite}
.logo p{margin:8px 0 0;color:var(--mut);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:14px;position:relative}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:28px;text-align:center;font-size:20px}
.sq{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:22px;font-weight:800}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 6px;border-radius:10px;font-weight:800;font-size:14px}
.seg button.on{background:linear-gradient(180deg,#9b7bff,#6443e8);color:#fff;box-shadow:0 4px 14px rgba(100,67,232,.5)}
.names{display:flex;flex-direction:column;gap:8px}
.names:empty{display:none}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-weight:700;outline:none}
.inp:focus{border-color:var(--gold)}
.menu-btns{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;justify-content:center;gap:20px;color:var(--mut);font-size:13px}
.foot label{display:flex;align-items:center;gap:6px}
.stline{margin:0;text-align:center;color:var(--mut);font-size:12px;letter-spacing:.04em}

/* ---------- Buttons ---------- */
.btn{position:relative;border:0;border-radius:18px;padding:15px 16px;font-weight:900;font-size:16px;letter-spacing:.06em;color:#fff;cursor:pointer;background:linear-gradient(180deg,#9b7bff,#6443e8);box-shadow:0 10px 26px rgba(100,67,232,.45),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .12s,filter .2s;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite;pointer-events:none}
.btn:active{transform:translateY(2px) scale(.98)}
.btn:disabled{filter:grayscale(.85) brightness(.6);cursor:default;transform:none}
.btn:disabled::after{display:none}
.btn-hit{background:linear-gradient(180deg,#ff7ab8,#ff3d7f 55%,#d91e63);box-shadow:0 10px 26px rgba(255,61,127,.45),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-stay{background:linear-gradient(180deg,#7ff5ff,#22c7e0 55%,#0f8fb0);box-shadow:0 10px 26px rgba(34,199,224,.4),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.2)}
.btn-ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line)}
.menu-btns .btn-hit{font-size:23px;padding:22px;letter-spacing:.12em}
.big{padding:20px 10px;font-size:19px}

/* ---------- Spiel ---------- */
#game{gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.chip.gold{color:var(--gold);border-color:rgba(255,209,102,.4)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:15px;font-weight:800;cursor:pointer}
#seats{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:safe center;gap:7px;padding:4px 2px 8px;scrollbar-width:none}
#seats::-webkit-scrollbar{display:none}
.seat{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr) 52px;align-items:center;gap:8px;padding:7px 9px 7px 8px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border:1px solid var(--line);transition:border-color .35s,box-shadow .35s,opacity .35s,background .35s;flex:0 0 auto}
.seat.cur{border-color:rgba(255,209,102,.9);background:linear-gradient(180deg,rgba(255,209,102,.18),rgba(255,209,102,.04));animation:curpulse 1.6s ease-in-out infinite}
.seat.out{opacity:.6}
.seat.bust{background:linear-gradient(180deg,rgba(255,59,92,.3),rgba(255,59,92,.07));border-color:rgba(255,80,110,.75);animation:shake .45s}
.seat.frozen{box-shadow:inset 0 0 0 1.5px rgba(143,233,255,.75),0 0 22px rgba(143,233,255,.3);background:linear-gradient(180deg,rgba(143,233,255,.24),rgba(143,233,255,.05))}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.av{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.6) 0,transparent 42%),hsl(var(--ph) 85% 55%);box-shadow:0 0 12px hsla(var(--ph),90%,60%,.6)}
.nm span{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot{font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;line-height:1}
.tot small{font-size:11px;color:var(--mut);font-weight:700;margin-left:2px}
.fan{display:flex;align-items:center;height:56px;overflow-x:auto;overflow-y:hidden;padding:2px 6px 2px 2px;scrollbar-width:none;min-width:0}
.fan::-webkit-scrollbar{display:none}
.slot{position:relative;flex:0 0 auto;width:36px;height:52px;margin-left:-12px}
.slot:first-child{margin-left:0}
.slot.ghost{opacity:.5;filter:grayscale(.8)}
.slot.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
.empty{font-size:12px;color:var(--mut);opacity:.7}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.rt .pts{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;line-height:1}
.tag{font-size:9px;font-weight:900;letter-spacing:.08em;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.tag.cur{background:var(--gold);color:#2a1800}
.tag.bust{background:#ff3b5c;color:#fff}
.tag.frz{background:#8fe9ff;color:#03303c}
.tag.stop{background:rgba(53,226,138,.25);color:#c6ffe2}
.bubble{position:absolute;top:-11px;right:12px;padding:4px 9px;border-radius:12px;background:#fff;color:#1b0f3d;font-weight:900;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.5,.4,1);z-index:2;white-space:nowrap}

.stage{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:22px;background:radial-gradient(90% 120% at 50% 50%,rgba(255,209,102,.14),transparent 70%);border:1px solid var(--line);min-height:116px;flex:0 0 auto}
.deck{position:relative;width:62px;height:88px;flex:0 0 auto}
.deck .back{position:absolute;inset:0;width:62px;height:88px;border-radius:11px}
.d3{transform:none}
.d1{transform:translate(-3px,-3px) rotate(-3deg);opacity:.8}
.d2{transform:translate(-1.5px,-1.5px) rotate(-1.5deg);opacity:.9}
.deck b{position:absolute;z-index:3;right:-8px;top:-8px;background:#1b0f3d;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;font-variant-numeric:tabular-nums}
.mid{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
#status{font-weight:900;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#odds{font-size:12px;color:var(--mut);font-weight:700;min-height:14px}
.pile{width:62px;height:88px;flex:0 0 auto;border-radius:11px;border:1.5px dashed rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:10px;gap:2px;font-weight:700}
.pile b{font-size:22px;color:var(--txt);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:0 0 auto}

#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translate(-50%,-14px);opacity:0;white-space:nowrap;padding:8px 16px;border-radius:999px;background:rgba(12,8,26,.88);border:1px solid rgba(255,209,102,.45);font-weight:900;font-size:13px;letter-spacing:.03em;transition:opacity .25s,transform .3s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92%;overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.good{border-color:rgba(53,226,138,.8);color:#c6ffe2}
#banner.warn{border-color:rgba(255,77,157,.8);color:#ffd6ea}
#banner.ice{border-color:rgba(143,233,255,.85);color:#d7f7ff}
#banner.gold{border-color:var(--gold);color:var(--gold)}
#stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:900;font-size:60px;letter-spacing:.08em;opacity:0;pointer-events:none;z-index:16;text-shadow:0 0 22px currentColor,0 5px 0 rgba(0,0,0,.45);white-space:nowrap}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:14;background:radial-gradient(circle at 50% 42%,rgba(255,209,102,.55),rgba(255,77,157,.15) 45%,transparent 70%)}

/* ---------- Karten ---------- */
.cf{position:relative;width:100%;height:100%;border-radius:11px;overflow:hidden;color:#fff;display:grid;place-items:center;background:linear-gradient(160deg,hsl(var(--h,200) 92% 68%),hsl(var(--h,200) 88% 42%) 70%,hsl(var(--h,200) 80% 27%));border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.45),0 0 18px hsla(var(--h,200),95%,60%,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.cf::before{content:'';position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.2) 100%);pointer-events:none}
.cf::after{content:'';position:absolute;left:50%;top:50%;width:70%;height:72%;transform:translate(-50%,-50%) rotate(14deg);border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.cf .n{position:relative;z-index:1;font-weight:900;font-size:40px;line-height:1}
.cf .c{position:absolute;z-index:1;font-weight:900;font-size:12px;line-height:1}
.cf .tl{top:5px;left:6px}
.cf .br{bottom:5px;right:6px;transform:rotate(180deg)}
.cf .cap{position:absolute;z-index:1;bottom:6px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:900;letter-spacing:.12em}
.cf.mod{background:linear-gradient(160deg,#fff7d6,#ffd166 45%,#e08a00);color:#4a2a00;text-shadow:none}
.cf.act .n{font-size:30px}
.cf.freeze{background:linear-gradient(160deg,#ecfdff,#5fd8ff 50%,#1c6fd0)}
.cf.flip3{background:linear-gradient(160deg,#fff0fb,#ff62c4 50%,#a0237e)}
.cf.second{background:linear-gradient(160deg,#eefff4,#3fe596 50%,#0d7d4b)}
.cf.big .n{font-size:46px}
.cf.big .c{font-size:14px}
.slot .cf .n{font-size:19px}
.slot .cf.act .n{font-size:16px}
.slot .cf .c,.slot .cf .cap{display:none}
.back{background:radial-gradient(circle at 30% 18%,rgba(255,77,157,.85),transparent 42%),radial-gradient(circle at 78% 92%,rgba(56,225,255,.75),transparent 46%),linear-gradient(160deg,#3a1d86,#150a3a);border:2px solid rgba(255,209,102,.75);box-shadow:0 6px 18px rgba(0,0,0,.45);display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:34px;text-shadow:0 0 14px rgba(255,209,102,.7);border-radius:11px}
.back::before{content:'7'}
.flyer{position:fixed;z-index:30;pointer-events:none;perspective:900px}
.fl-in{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.fb,.ff{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{transform:rotateY(180deg)}
.flyer .fb{box-shadow:0 14px 30px rgba(0,0,0,.6)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(4,3,12,.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fade .25s ease-out}
.modal.out{opacity:0;transition:opacity .2s}
.mbox{width:min(92vw,390px);max-height:86vh;overflow:auto;padding:20px;border-radius:24px;background:linear-gradient(180deg,#2a1859,#140b33);border:1px solid rgba(255,209,102,.35);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(123,92,255,.3);animation:pop .4s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:12px;text-align:center}
.mbox h2,.mbox h3{margin:0;font-weight:900}
.mbox h3{font-size:22px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.stbl{display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:800}
.srow.b{opacity:.6}
.sn{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn i{width:10px;height:10px;border-radius:50%;background:hsl(var(--ph) 85% 60%);flex:0 0 10px}
.sr{color:var(--mut);font-variant-numeric:tabular-nums}
.st{font-size:18px;font-variant-numeric:tabular-nums;color:var(--gold)}
.rules{text-align:left;font-size:14px;line-height:1.5;color:#e9e3ff;display:flex;flex-direction:column;gap:8px}
.rules b{color:var(--gold)}
.handoff h2{font-size:34px;color:var(--gold);margin:6px 0}
.win h2{font-size:38px;margin:2px 0;text-shadow:0 0 24px currentColor}

/* ---------- Hochkant-Hinweis ---------- */
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b0718;place-items:center;text-align:center;padding:30px;font-weight:800;font-size:18px}
@media (orientation:landscape) and (max-height:520px){#rot{display:grid}#app{display:none}}

/* ---------- Animationen ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes land{0%{transform:translateY(-22px) scale(1.25);filter:brightness(1.7)}100%{transform:none}}
@keyframes curpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}50%{box-shadow:0 0 0 6px rgba(255,209,102,.12)}}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen">
    <div class="bgc" style="left:-12px;top:14%;--r:-14deg;animation-delay:0s"></div>
    <div class="bgc" style="right:-8px;top:34%;--r:12deg;animation-delay:-3s"></div>
    <div class="bgc" style="left:18%;bottom:20%;--r:-6deg;animation-delay:-6s"></div>

    <div class="logo">
      <h1>FLIP 7</h1>
      <p>Push your luck · gegen Bots</p>
    </div>

    <div class="panel">
      <div class="row"><span class="lbl">Menschen</span>
        <div class="step"><button class="sq" id="hMinus" aria-label="weniger">−</button><b id="hC">1</b><button class="sq" id="hPlus" aria-label="mehr">+</button></div>
      </div>
      <div class="names" id="names"></div>
      <div class="row"><span class="lbl">Bots</span>
        <div class="step"><button class="sq" id="bMinus" aria-label="weniger">−</button><b id="bC">2</b><button class="sq" id="bPlus" aria-label="mehr">+</button></div>
      </div>
      <div class="col"><span class="lbl">Bot-Stärke</span>
        <div class="seg" id="diff"><button data-v="0">Leicht</button><button data-v="1">Normal</button><button data-v="2">Schwer</button></div>
      </div>
      <div class="col"><span class="lbl">Zielpunkte</span>
        <div class="seg" id="tgt"><button data-v="100">100</button><button data-v="150">150</button><button data-v="200">200</button></div>
      </div>
    </div>

    <div class="menu-btns">
      <button class="btn btn-hit" id="start">SPIELEN</button>
      <div class="two">
        <button class="btn btn-ghost" id="rules">Regeln</button>
        <button class="btn btn-ghost" id="stats">Statistik</button>
      </div>
    </div>
    <div class="foot">
      <label><input type="checkbox" id="snd"> Sound</label>
      <label><input type="checkbox" id="hap"> Vibration</label>
    </div>
    <p class="stline" id="stline"></p>
  </section>

  <section id="game" class="screen hide">
    <header class="top">
      <button class="iconbtn" id="quit" aria-label="Beenden">✕</button>
      <div class="chip" id="rnd">Runde 1</div>
      <div class="chip gold" id="tgtlbl">Ziel 200</div>
    </header>

    <div id="seats"></div>

    <div class="stage">
      <div class="deck" id="deck">
        <div class="back d1"></div><div class="back d2"></div><div class="back d3"></div>
        <b id="deckn">94</b>
      </div>
      <div class="mid">
        <div id="status">…</div>
        <div id="odds"></div>
      </div>
      <div class="pile"><b id="discn">0</b><span>Ablage</span></div>
    </div>

    <div class="actions">
      <button class="btn btn-hit big" id="hit" disabled>ZIEHEN</button>
      <button class="btn btn-stay big" id="stay" disabled>BLEIBEN</button>
    </div>

    <div id="banner"></div>
    <div id="stamp"></div>
    <div id="flash"></div>
  </section>

  <div id="rot">Bitte das Handy hochkant halten</div>
</div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';

/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let AC = null;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, o = {}){
  const a = audio(); if (!a || !SET.snd) return;
  const t = a.currentTime + (o.t || 0);
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.v || 0.12, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + d + 0.05);
}
function noise(d, v){
  const a = audio(); if (!a || !SET.snd) return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf; g.gain.value = v;
  src.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  draw:   () => tone(740, .12, { type: 'triangle', v: .13, to: 980 }),
  mod:    () => tone(880, .14, { v: .12, to: 1320 }),
  stay:   () => { tone(523, .18, { v: .11 }); tone(784, .24, { v: .11, t: .08 }); },
  bust:   () => { tone(220, .5, { type: 'sawtooth', v: .09, to: 52 }); noise(.28, .12); },
  freeze: () => [1760, 1320, 2200].forEach((f, i) => tone(f, .3, { v: .07, t: i * .05 })),
  chance: () => { tone(660, .15, { type: 'triangle', v: .13 }); tone(990, .22, { type: 'triangle', v: .13, t: .1 }); },
  flip7:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .55, { type: 'triangle', v: .15, t: i * .08 })),
  win:    () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .45, { v: .14, t: i * .12 })),
  tick:   () => tone(1200, .035, { type: 'square', v: .035 })
};
function sfx(n){ try { SFX[n] && SFX[n](); } catch (e) {} }
function buzz(p){ if (SET.hap && navigator.vibrate){ try { navigator.vibrate(p); } catch (e) {} } }

/* ================= Partikel-Effekte ================= */
const cv = $('#fx'), cx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function fitCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', fitCanvas); fitCanvas();
const parts = [];
const FX = {
  burst(x, y, col, n = 28, sp = 5, life = .9){
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, v = sp * (.35 + Math.random() * .9);
      parts.push({ k: 0, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: life * (.6 + Math.random() * .6), c: col, r: 1.4 + Math.random() * 2.4, g: .09 });
    }
  },
  confetti(n = 160){
    const cols = ['#ffd166', '#ff4d9d', '#38e1ff', '#7b5cff', '#35e28a', '#ffffff'];
    for (let i = 0; i < n; i++) parts.push({ k: 1, x: Math.random() * VW, y: -20 - Math.random() * VH * .25, vx: (Math.random() - .5) * 1.6, vy: 1.6 + Math.random() * 2.6, sw: Math.random() * 6.28, life: 0, max: 3.4 + Math.random() * 1.8, c: cols[i % cols.length], w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3 });
  }
};
let lastT = performance.now();
function tick(now){
  const dt = Math.min(2, (now - lastT) / 16.67); lastT = now;
  cx.clearRect(0, 0, VW, VH);
  cx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life += dt / 60;
    if (p.life > p.max){ parts.splice(i, 1); continue; }
    const a = 1 - p.life / p.max;
    cx.globalAlpha = Math.min(1, a * 1.6);
    cx.fillStyle = p.c;
    if (p.k === 0){
      p.vy += p.g * dt;
      const drag = Math.pow(.97, dt);
      p.vx *= drag; p.vy *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt;
      cx.beginPath(); cx.arc(p.x, p.y, p.r * (.5 + a * .5), 0, 6.283); cx.fill();
    } else {
      p.sw += .08 * dt;
      p.x += (p.vx + Math.sin(p.sw) * .8) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= Karten & Deck ================= */
const hueOf = v => v === 0 ? 190 : (v * 37) % 360;
function faceColor(c){ return c.k === 'num' ? `hsl(${hueOf(c.v)} 92% 64%)` : '#ffd166'; }
function faceHTML(c, cls = ''){
  if (c.k === 'num') return `<div class="cf ${cls}" style="--h:${hueOf(c.v)}"><span class="c tl">${c.v}</span><span class="n">${c.v}</span><span class="c br">${c.v}</span></div>`;
  if (c.k === 'mod') return `<div class="cf mod ${cls}"><span class="n">+${c.v}</span></div>`;
  if (c.k === 'mx2') return `<div class="cf mod ${cls}"><span class="n">×2</span></div>`;
  const map = { freeze: ['❄', 'FREEZE', 'freeze'], flip3: ['3', 'FLIP THREE', 'flip3'], second: ['↺', '2. CHANCE', 'second'] };
  const [ic, lb, k] = map[c.a];
  return `<div class="cf act ${k} ${cls}"><span class="n">${ic}</span><span class="cap">${lb}</span></div>`;
}
function makeDeck(){
  const d = [];
  for (let n = 0; n <= 12; n++){ const copies = n === 0 ? 1 : n; for (let i = 0; i < copies; i++) d.push({ k: 'num', v: n }); }
  [2, 4, 6, 8, 10].forEach(v => d.push({ k: 'mod', v }));
  d.push({ k: 'mx2' });
  for (let i = 0; i < 3; i++) ['freeze', 'flip3', 'second'].forEach(a => d.push({ k: 'act', a }));
  d.forEach((c, i) => c.id = i);
  return shuffle(d);
}
function drawCard(){
  if (!G.deck.length){
    if (!G.discard.length) return null;
    G.deck = shuffle(G.discard); G.discard = [];
  }
  return G.deck.pop();
}
const poolCards = () => G.deck.length ? G.deck : G.discard;

/* ---------- Punkte & Wahrscheinlichkeiten ---------- */
function livePts(p){
  if (p.busted) return 0;
  const base = p.hand.reduce((s, c) => s + c.v, 0);
  return (p.x2 ? base * 2 : base) + p.mods.reduce((s, c) => s + c.v, 0);
}
function roundScore(p){ return p.busted ? 0 : livePts(p) + (G.flip7 === p ? 15 : 0); }
function bustChance(p){
  if (p.busted || !p.active) return 0;
  const pool = poolCards(); if (!pool.length) return 0;
  const nums = new Set(p.hand.map(c => c.v));
  let d = 0;
  for (const c of pool) if (c.k === 'num' && nums.has(c.v)) d++;
  return d / pool.length;
}
function botDecide(p){
  if (!p.hand.length) return 'hit';
  let risk = p.risk;
  if (G.difficulty === 0){
    if (Math.random() < .12) return Math.random() < .5 ? 'hit' : 'stay';
    risk += (Math.random() - .5) * .5;
  } else if (G.difficulty === 1){
    risk += (Math.random() - .5) * .14;
  } else {
    const others = G.players.filter(q => q !== p).map(q => q.total);
    if (others.length && p.total < Math.max(...others) - 40) risk *= 1.1;
  }
  const pool = poolCards(); if (!pool.length) return 'stay';
  const nums = new Set(p.hand.map(c => c.v));
  let pb = 0, gsum = 0, safeNum = 0;
  for (const c of pool){
    if (c.k === 'num'){ if (nums.has(c.v)) pb++; else { gsum += c.v; safeNum++; } }
    else if (c.k === 'mod') gsum += c.v;
  }
  pb /= pool.length; gsum /= pool.length; safeNum /= pool.length;
  if (p.second) pb *= .35;
  const cur = livePts(p);
  const bonus = p.hand.length === 6 ? 15 * safeNum : 0;
  // Erwartungswert: Weitermachen lohnt sich, wenn der Gewinn das Risiko des Verlusts aufwiegt
  return risk * (gsum + bonus) >= pb * cur ? 'hit' : 'stay';
}

/* ================= Spielablauf ================= */
const chk = sid => { if (sid !== G.session) throw 'abort'; };

async function runGame(sid){
  try {
    for (;;){
      await playRound(sid);
      await settle(sid);
      const w = winnerCheck();
      if (w){ await finish(w, sid); return; }
      G.dealer = (G.dealer + 1) % G.players.length;
    }
  } catch (e) { if (e !== 'abort') console.error(e); }
}
async function playRound(sid){
  resetRound();
  G.round++;
  render();
  banner(`Runde ${G.round}`, 'info');
  setStatus(`Runde ${G.round} beginnt`);
  await sleep(900); chk(sid);
  let last = G.dealer;
  while (!G.flip7 && G.players.some(p => p.active)){
    chk(sid);
    const n = G.players.length; let p = null;
    for (let k = 1; k <= n; k++){ const q = G.players[(last + k) % n]; if (q.active){ p = q; break; } }
    last = p.id;
    G.cur = p.id; render();
    await turn(p, sid);
    chk(sid); render();
  }
  G.cur = null; G.roundOver = true; render();
}
async function turn(p, sid){
  if (p.human){
    const act = await askHuman(p, sid);
    if (act === 'stay'){ stay(p); sfx('stay'); render(); return; }
    await hit(p, sid);
    return;
  }
  setStatus(`${p.name} überlegt …`);
  await sleep(rnd(520, 820)); chk(sid);
  if (botDecide(p) === 'stay'){
    stay(p); sfx('stay'); buzz(15);
    say(p, pick(['Stopp!', 'Ich bleibe.', 'Genug!', 'Sicher!']));
    render(); await sleep(450);
  } else {
    await hit(p, sid);
  }
}
async function askHuman(p, sid){
  if (G.humanCount > 1 && G.lastHuman !== -1 && G.lastHuman !== p.id){
    await modal(`<div class="handoff"><small class="sub">Gerät weitergeben</small><h2>${esc(p.name)}</h2><p class="sub">Tippe, wenn du dran bist.</p></div>`, [{ label: 'Bereit', val: 1, cls: 'btn-hit' }]);
    chk(sid);
  }
  G.lastHuman = p.id;
  render();
  setActions(true, p);
  const act = await new Promise(res => { G.humanRes = res; });
  chk(sid);
  return act;
}
function answer(a){
  if (!G.humanRes) return;
  const r = G.humanRes; G.humanRes = null;
  setActions(false);
  if (a === 'hit') sfx('tick');
  r(a);
}
function setActions(on, p){
  $('#hit').disabled = !on; $('#stay').disabled = !on;
  if (on && p){
    setStatus(`${p.name}, du bist dran`);
    const pb = Math.round(bustChance(p) * 100);
    $('#odds').textContent = `Bust-Chance ${pb}% · Bank ${livePts(p)} Pkt` + (p.second ? ' · Zweite Chance aktiv' : '');
  } else {
    $('#odds').textContent = '';
  }
}
async function hit(p, sid){
  setActions(false);
  const c = drawCard();
  if (!c){ stay(p); return; }
  setStatus(`${p.name} zieht …`);
  await flyDraw(c, p);
  chk(sid);
  await resolve(c, p, sid);
  chk(sid);
  render();
}
function stay(p){ p.active = false; if (!p.busted) p.stayed = true; }

/* ---------- Karte auflösen ---------- */
async function resolve(c, p, sid){
  if (c.k === 'num'){
    if (p.hand.some(x => x.v === c.v)){
      if (p.second){
        p.second = false;
        G.discard.push(c, { k: 'act', a: 'second', id: -1 });
        say(p, 'Zweite Chance!');
        banner(`${p.name} nutzt die Zweite Chance`, 'good');
        sfx('chance'); buzz(40); fxAt(p, '#35e28a', 30);
      } else {
        bust(p, c);
      }
      return;
    }
    p.hand.push(c); G.landed = p.id; sfx('draw');
    if (p.hand.length === 7) flip7Fx(p);
    return;
  }
  if (c.k === 'mod'){ p.mods.push(c); G.landed = p.id; sfx('mod'); return; }
  if (c.k === 'mx2'){ p.x2 = true; G.landed = p.id; sfx('mod'); return; }

  // Aktionskarten
  if (c.a === 'freeze'){
    const t = await pickTarget(p, activePl(), 'Einfrieren');
    chk(sid);
    G.discard.push(c);
    t.frozen = true; stay(t);
    sfx('freeze'); buzz(60); fxAt(t, '#8fe9ff', 34);
    banner(`${p.name} friert ${t.name} ein`, 'ice');
    return;
  }
  if (c.a === 'flip3'){
    const t = await pickTarget(p, activePl(), 'Flip Three');
    chk(sid);
    G.discard.push(c);
    banner(`Flip Three: ${t.name} zieht 3 Karten`, 'warn');
    sfx('mod');
    render();
    await sleep(350); chk(sid);
    for (let i = 0; i < 3; i++){
      if (!t.active || G.flip7) break;
      const x = drawCard(); if (!x) break;
      await flyDraw(x, t); chk(sid);
      await resolve(x, t, sid); chk(sid);
      render(); await sleep(180);
    }
    return;
  }
  if (c.a === 'second'){
    if (!p.second){
      p.second = true; G.landed = p.id; sfx('chance');
      say(p, 'Schutz!');
      banner(`${p.name} hält eine Zweite Chance`, 'good');
      return;
    }
    const cands = activePl().filter(q => !q.second && q !== p);
    if (!cands.length){ G.discard.push(c); banner('Niemand braucht sie gerade', ''); return; }
    const t = await pickTarget(p, cands, 'Zweite Chance weitergeben');
    chk(sid);
    t.second = true; G.landed = t.id; sfx('chance');
    banner(`${p.name} gibt ${t.name} eine Zweite Chance`, 'good');
  }
}
function bust(p, c){

}

}
const activePl = () => G.players.filter(q => q.active);

/* ---------- Ziel wählen ---------- */
async function pickTarget(p, cands, title){
  if (cands.length === 1) return cands[0];
  if (p.human){
    const id = await modal(`<h3>${title}</h3><p class="sub">${esc(p.name)} wählt ein Ziel</p>`,
      cands.map(q => ({ label: q.name, val: q.id, cls: 'btn-ghost' })));
    return G.players[id];
  }
  const s = cands.slice();
  if (title === 'Einfrieren') s.sort((a, b) => livePts(a) - livePts(b));
  else if (title === 'Flip Three') s.sort((a, b) => bustChance(b) - bustChance(a));
  else s.sort(() => Math.random() - .5);
  return s[0];
}

/* ---------- Karte fliegt vom Deck zum Spieler ---------- */
async function flyDraw(c, p){
  const d = $('#deck').getBoundingClientRect();
  const W = 84, H = 118;
  const cx0 = d.left + d.width / 2, cy0 = d.top + d.height / 2;
  const el = document.createElement('div');
  el.className = 'flyer';
  el.style.cssText = `left:${cx0 - W / 2}px;top:${cy0 - H / 2}px;width:${W}px;height:${H}px`;
  el.innerHTML = `<div class="fl-in"><div class="fb back"></div><div class="ff">${faceHTML(c, 'big')}</div></div>`;
  document.body.appendChild(el);
  sfx('draw'); buzz(8);
  try {
    await el.firstElementChild.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }],
      { duration: 380, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' }).finished;
    await sleep(150);
    const fan = document.querySelector(`#seat-${p.id} .fan`);
    const r = fan ? fan.getBoundingClientRect() : d;
    const ex = Math.min(r.right - 26, r.left + r.width * .92), ey = r.top + r.height / 2;
    await el.animate([{ transform: 'translate(0px,0px) scale(1)' },
      { transform: `translate(${ex - cx0}px,${ey - cy0}px) scale(${40 / W})` }],
      { duration: 430, easing: 'cubic-bezier(.2,.85,.25,1)', fill: 'forwards' }).finished;
    FX.burst(ex, ey, faceColor(c), 14, 3.5, .55);
  } finally {
    el.remove();
  }
}

/* ---------- Rundenende ---------- */
async function settle(sid){
  G.roundOver = true; G.cur = null; render();
  for (const p of G.players){ p.round = roundScore(p); p.total += p.round; }
  if (G.flip7) STATS.flip7++;
  saveStats();
  const sorted = G.players.slice().sort((a, b) => b.total - a.total);
  const rows = sorted.map(p => {
    const prev = p.total - p.round;
    return `<div class="srow ${p.busted ? 'b' : ''}"><span class="sn"><i style="--ph:${p.hue}"></i>${esc(p.name)}</span><span class="sr">${p.busted ? 'BUST' : '+' + p.round}</span><span class="st" data-from="${prev}" data-to="${p.total}">${prev}</span></div>`;
  }).join('');
  await modal(
    `<h3>Runde ${G.round}</h3><p class="sub">${G.flip7 ? `FLIP 7 von ${esc(G.flip7.name)} · +15 Bonus` : 'Punktestand'}</p><div class="stbl">${rows}</div>`,
    [{ label: 'Weiter', val: 1, cls: 'btn-hit' }],
    el => el.querySelectorAll('.st').forEach(s => countUp(s, +s.dataset.from, +s.dataset.to, 900))
  );
  chk(sid);
}
function countUp(el, from, to, ms){
  const t0 = performance.now();
  const step = now => {
    const k = clamp((now - t0) / ms, 0, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function winnerCheck(){
  const top = Math.max(...G.players.map(p => p.total));
  if (top < G.target) return null;
  const leaders = G.players.filter(p => p.total === top);
  return leaders.length === 1 ? leaders[0] : null;
}
async function finish(w, sid){
  STATS.games++; if (w.human) STATS.wins++; saveStats();
  sfx('win'); buzz([0, 90, 60, 160]);
  FX.confetti(180);
  const ranking = G.players.slice().sort((a, b) => b.total - a.total)
    .map((p, i) => `<div class="srow"><span class="sn">${i + 1}. ${esc(p.name)}</span><span class="st">${p.total}</span></div>`).join('');
  const choice = await modal(
    `<small class="sub">Gewinner</small><h2 style="color:hsl(${w.hue} 95% 70%)">${esc(w.name)}</h2><p class="sub">${w.total} Punkte nach ${G.round} ${G.round === 1 ? 'Runde' : 'Runden'}</p><div class="stbl">${ranking}</div>`,
    [{ label: 'Nochmal', val: 'again', cls: 'btn-hit' }, { label: 'Menü', val: 'menu', cls: 'btn-ghost' }]
  );
  if (choice === 'again') startGame(); else toMenu();
}

/* ================= Anzeige ================= */
function seatHTML(p){
  const isCur = G.cur === p.id && !G.roundOver && G.running;
  const cls = ['seat', isCur ? 'cur' : '', p.busted ? 'bust' : '', p.frozen ? 'frozen' : '', (!p.active && !p.busted) ? 'out' : ''].join(' ');
  let tag = '';
  if (p.busted) tag = '<span class="tag bust">BUST</span>';
  else if (p.frozen) tag = '<span class="tag frz">FREEZE</span>';
  else if (isCur) tag = '<span class="tag cur">AM ZUG</span>';
  else if (p.stayed) tag = '<span class="tag stop">STOPP</span>';
  let slots = p.hand.map(c => `<div class="slot">${faceHTML(c, 'sm')}</div>`).join('');
  slots += p.mods.map(c => `<div class="slot">${faceHTML(c)}</div>`).join('');
  if (p.x2) slots += `<div class="slot">${faceHTML({ k: 'mx2' })}</div>`;
  if (p.second) slots += `<div class="slot">${faceHTML({ k: 'act', a: 'second' })}</div>`;
  if (p.ghost) slots += `<div class="slot ghost">${faceHTML(p.ghost)}</div>`;
  if (!slots) slots = '<span class="empty">keine Karten</span>';
  return `<div class="${cls}" id="seat-${p.id}" style="--ph:${p.hue}">
    ${p.say ? `<div class="bubble">${esc(p.say)}</div>` : ''}
    <div class="who">
      <div class="nm"><i class="av">${esc(p.name.charAt(0).toUpperCase())}</i><span>${esc(p.name)}</span></div>
      <div class="tot">${p.total}<small>/${G.target}</small></div>
    </div>
    <div class="fan">${slots}</div>
    <div class="rt"><div class="pts">${p.busted ? '0' : '+' + livePts(p)}</div>${tag}</div>
  </div>`;
}
function render(){
  if (!G.running) return;
  const wrap = $('#seats');
  const keep = wrap.scrollTop;
  wrap.innerHTML = G.players.map(seatHTML).join('');
  wrap.scrollTop = keep;
  if (G.landed != null){
    const s = document.querySelector(`#seat-${G.landed} .fan .slot:last-child`);
    if (s) s.classList.add('land');
    G.landed = null;
  }
  $('#rnd').textContent = `Runde ${G.round}`;
  $('#tgtlbl').textContent = `Ziel ${G.target}`;
  $('#deckn').textContent = G.deck.length;
  $('#discn').textContent = G.discard.length;
}
function setStatus(t){ $('#status').textContent = t; }
let bannerT = 0;
function banner(t, kind = ''){
  const b = $('#banner');
  b.textContent = t; b.className = 'show ' + kind;
  clearTimeout(bannerT);
  bannerT = setTimeout(() => b.classList.remove('show'), 1500);
}
function stamp(t, col){
  const el = $('#stamp');
  el.textContent = t; el.style.color = col;
  el.animate([
    { transform: 'translate(-50%,-50%) scale(2.4) rotate(-12deg)', opacity: 0 },
    { transform: 'translate(-50%,-50%) scale(1) rotate(-6deg)', opacity: 1, offset: .25 },
    { transform: 'translate(-50%,-50%) scale(1) rotate(-6deg)', opacity: 1, offset: .7 },
    { transform: 'translate(-50%,-50%) scale(1.15) rotate(-6deg)', opacity: 0 }
  ], { duration: 1100, easing: 'ease-out' });
}
function shake(){
  $('#app').animate([{ transform: 'translate(0)' }, { transform: 'translate(-6px,3px)' }, { transform: 'translate(6px,-3px)' }, { transform: 'translate(-4px,2px)' }, { transform: 'translate(0)' }], { duration: 380 });
}
function say(p, t){
  p.say = t; clearTimeout(p._st);
  p._st = setTimeout(() => { p.say = ''; render(); }, 1300);
}
function fxAt(p, col, n = 26){
  const el = document.getElementById('seat-' + p.id); if (!el) return;
  const r = el.getBoundingClientRect();
  FX.burst(r.left + r.width * .55, r.top + r.height * .5, col, n, 5.5, .8);
}
function modal(html, buttons, onOpen){
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<div class="mbox">${html}<div class="mbtns"></div></div>`;
    const bw = el.querySelector('.mbtns');
    buttons.forEach(b => {
      const x = document.createElement('button');
      x.className = 'btn ' + (b.cls || '');
      x.textContent = b.label;
      x.onclick = () => { el.classList.add('out'); setTimeout(() => el.remove(), 200); res(b.val); };
      bw.appendChild(x);
    });
    document.body.appendChild(el);
    if (onOpen) onOpen(el);
  });
}

/* ================= Menü & Navigation ================= */
function showScreen(name){
  $('#menu').classList.toggle('hide', name !== 'menu');
  $('#game').classList.toggle('hide', name !== 'game');
}
function toMenu(){
  G.session++; G.running = false; G.humanRes = null;
  document.querySelectorAll('.modal').forEach(m => m.remove());
  showScreen('menu'); updateStats();
}
function updateStats(){
  $('#stline').textContent = `Spiele ${STATS.games} · Siege ${STATS.wins} · FLIP 7: ${STATS.flip7} · Busts: ${STATS.busts}`;
}
function clampCfg(){
  CFG.humans = clamp(CFG.humans, 1, 4);
  CFG.bots = clamp(CFG.bots, 0, 5);
  if (CFG.humans + CFG.bots > 6) CFG.bots = 6 - CFG.humans;
  if (CFG.humans + CFG.bots < 2) CFG.bots = 2 - CFG.humans;
}
function renderCfg(){
  clampCfg();
  $('#hC').textContent = CFG.humans;
  $('#bC').textContent = CFG.bots;
  $('#names').innerHTML = Array.from({ length: CFG.humans }, (_, i) =>
    `<input class="inp" data-i="${i}" maxlength="14" value="${esc(CFG.names[i] || ('Spieler ' + (i + 1)))}" aria-label="Name ${i + 1}">`).join('');
  document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('on', +b.dataset.v === CFG.diff));
  document.querySelectorAll('#tgt button').forEach(b => b.classList.toggle('on', +b.dataset.v === CFG.target));
}

function startGame(){
  audio();
  const players = [];
  for (let i = 0; i < CFG.humans; i++) players.push(mkPlayer({ name: (CFG.names[i] || '').trim() || `Spieler ${i + 1}`, human: true, risk: 1 }));
  for (let i = 0; i < CFG.bots; i++) players.push(mkPlayer({ name: BOTS[i].n, human: false, risk: BOTS[i].risk }));
  players.forEach((p, i) => { p.id = i; p.hue = HUES[i % HUES.length]; });

  G.session++;
  const sid = G.session;
  Object.assign(G, {
    players, deck: makeDeck(), discard: [], round: 0, dealer: 0, target: CFG.target,
    difficulty: CFG.diff, humanCount: CFG.humans, lastHuman: -1, cur: null,
    roundOver: false, flip7: null, humanRes: null, landed: null, running: true
  });
  document.querySelectorAll('.modal').forEach(m => m.remove());
  showScreen('game');
  setActions(false);
  render();
  runGame(sid);
}

const RULES = `<h3>Regeln</h3><div class="rules">
<p><b>Ziel:</b> Wer zuerst die Zielpunkte erreicht und am Rundenende vorne liegt, gewinnt.</p>
<p><b>Ziehen:</b> Decke eine Karte auf. Eine Zahl, die du schon hast, ist ein <b>Bust</b>: Du verlierst alle Punkte dieser Runde.</p>
<p><b>Bleiben:</b> Sichere deine Punkte und steige aus der Runde aus.</p>
<p><b>FLIP 7:</b> Sieben verschiedene Zahlen beenden die Runde sofort, dazu gibt es +15.</p>
<p><b>Modifikatoren:</b> +2 bis +10 werden addiert, ×2 verdoppelt die Zahlen.</p>
<p><b>Aktionen:</b> ❄ Einfrieren (Ziel muss sofort bleiben) · 3 Flip Three (Ziel zieht drei Karten) · ↺ Zweite Chance (schützt vor einem Bust).</p>
</div>`;

/* ================= Ereignisse ================= */
$('#start').onclick = startGame;
$('#hMinus').onclick = () => { CFG.humans--; renderCfg(); };
$('#hPlus').onclick = () => { CFG.humans++; renderCfg(); };
$('#bMinus').onclick = () => { CFG.bots--; renderCfg(); };
$('#bPlus').onclick = () => { CFG.bots++; renderCfg(); };
$('#diff').onclick = e => { const b = e.target.closest('button'); if (b){ CFG.diff = +b.dataset.v; renderCfg(); } };
$('#tgt').onclick = e => { const b = e.target.closest('button'); if (b){ CFG.target = +b.dataset.v; renderCfg(); } };
$('#names').oninput = e => { CFG.names[+e.target.dataset.i] = e.target.value; };
$('#snd').onchange = e => { SET.snd = e.target.checked; LS.set('f7_snd', SET.snd); if (SET.snd) audio(); };
$('#hap').onchange = e => { SET.hap = e.target.checked; LS.set('f7_hap', SET.hap); };
$('#rules').onclick = () => modal(RULES, [{ label: 'Verstanden', val: 1, cls: 'btn-hit' }]);
$('#stats').onclick = () => modal(
  `<h3>Statistik</h3><div class="stbl">
   <div class="srow"><span class="sn">Spiele</span><span class="st">${STATS.games}</span></div>
   <div class="srow"><span class="sn">Siege</span><span class="st">${STATS.wins}</span></div>
   <div class="srow"><span class="sn">FLIP 7</span><span class="st">${STATS.flip7}</span></div>
   <div class="srow"><span class="sn">Busts</span><span class="st">${STATS.busts}</span></div></div>`,
  [{ label: 'Schließen', val: 1, cls: 'btn-ghost' }]);
$('#hit').onclick = () => answer('hit');
$('#stay').onclick = () => answer('stay');
$('#quit').onclick = async () => {
  if (!G.running) return;
  const r = await modal('<h3>Spiel beenden?</h3><p class="sub">Der aktuelle Fortschritt geht verloren.</p>',
    [{ label: 'Beenden', val: 1, cls: 'btn-hit' }, { label: 'Weiterspielen', val: 0, cls: 'btn-ghost' }]);
  if (r === 1) toMenu();
};

/* ================= Start ================= */
$('#snd').checked = SET.snd;
$('#hap').checked = SET.hap;
renderCfg();
updateStats();
showScreen('menu');
})();
</script>
</body>
</html>
